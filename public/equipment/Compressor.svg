<!-- Display screen -->
<rect x="302" y="130" width="90" height="40" rx="3.5" fill="#151515"/>
<rect x="306" y="134" width="82" height="32" rx="2.5" fill="url(#scrC)"/>
<rect x="306" y="134" width="82" height="32" rx="2.5" fill="url(#scrGl)"/>
<rect x="314" y="140" width="50" height="5" rx="1" fill="#fff" opacity="0.35"/>
<rect x="314" y="149" width="38" height="3.5" rx="1" fill="#fff" opacity="0.2"/>
<rect x="314" y="156" width="28" height="7" rx="2" fill="#27AE60" opacity="0.65"/>
<text x="319" y="162" font-family="Arial" font-size="5.5" fill="#fff" opacity="0.9">RUN</text>
<circle cx="375" cy="158" r="2.5" fill="#2ECC71"/>

<!-- Power switch -->
<rect x="410" y="134" width="24" height="32" rx="3.5" fill="#D8D8D8" stroke="#BCBCBC" stroke-width="0.5"/>
<rect x="415" y="137" width="14" height="14" rx="2.5" fill="#505050"/>
<line x1="422" y1="140" x2="422" y2="148" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>

<!-- NOXERIOR -->
<text x="327" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#C0392B" letter-spacing="2.8" text-anchor="middle">NOXERIOR</text>
<rect x="277" y="206" width="100" height="1.5" rx="0.5" fill="#C0392B" opacity="0.35"/>

<!-- Compressor -->
<text x="327" y="228" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#7A828A" letter-spacing="1.2" text-anchor="middle">Compressor</text>

<!-- Front panel recessed area (clean, no keyhole, no plate) -->
<rect x="212" y="245" width="232" height="295" rx="3" fill="none" stroke="#D8D8D8" stroke-width="0.4"/>
<line x1="214" y1="246" x2="442" y2="246" stroke="#CDCDCD" stroke-width="0.6"/>
<line x1="214" y1="539" x2="442" y2="539" stroke="#fff" stroke-width="0.4" opacity="0.3"/>

