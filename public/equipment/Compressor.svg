<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="cbF" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#F5F5F5"/>
<stop offset="4%" stop-color="#F2F2F2"/>
<stop offset="35%" stop-color="#ECECEC"/>
<stop offset="65%" stop-color="#E4E4E4"/>
<stop offset="90%" stop-color="#DDDDDD"/>
<stop offset="100%" stop-color="#D8D8D8"/>
</linearGradient>
<linearGradient id="cbT" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#FDFDFD"/>
<stop offset="40%" stop-color="#F4F4F4"/>
<stop offset="100%" stop-color="#E8E8E8"/>
</linearGradient>
<linearGradient id="cbS" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#E0E0E0"/>
<stop offset="20%" stop-color="#D4D4D4"/>
<stop offset="80%" stop-color="#C4C4C4"/>
<stop offset="100%" stop-color="#B8B8B8"/>
</linearGradient>
<linearGradient id="ctrlBg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#EBEBEB"/>
<stop offset="100%" stop-color="#DCDCDC"/>
</linearGradient>
<linearGradient id="scrC" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1E94E8"/>
<stop offset="50%" stop-color="#1780D4"/>
<stop offset="100%" stop-color="#0E6AB8"/>
</linearGradient>
<linearGradient id="scrGl" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
<stop offset="40%" stop-color="#fff" stop-opacity="0.04"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.06"/>
</linearGradient>
<linearGradient id="hlS" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="ventG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#D2D2D2"/>
<stop offset="50%" stop-color="#C6C6C6"/>
<stop offset="100%" stop-color="#BABABA"/>
</linearGradient>
<linearGradient id="rubberG" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#555"/>
<stop offset="40%" stop-color="#444"/>
<stop offset="100%" stop-color="#333"/>
</linearGradient>
