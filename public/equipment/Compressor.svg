<!-- Shadow -->
<ellipse cx="335" cy="572" rx="145" ry="10" fill="#000" opacity="0.08"/>

<!-- Rubber feet -->
<rect x="208" y="555" width="28" height="10" rx="4" fill="url(#rubberG)"/>
<rect x="211" y="561" width="22" height="5" rx="2.5" fill="#2A2A2A"/>
<rect x="418" y="555" width="28" height="10" rx="4" fill="url(#rubberG)"/>
<rect x="421" y="561" width="22" height="5" rx="2.5" fill="#2A2A2A"/>
<polygon points="232,544 250,536 276,536 258,544" fill="#444" opacity="0.6"/>
<polygon points="440,544 458,536 484,536 466,544" fill="#444" opacity="0.6"/>

<!-- Main cabinet body -->
<path d="M195,115 Q195,111 199,111 L455,111 Q459,111 459,115 L459,555 Q459,558 455,558 L199,558 Q195,558 195,555 Z" fill="url(#cbF)" stroke="#C2C2C2" stroke-width="0.5"/>
<polygon points="195,111 230,84 494,84 459,111" fill="url(#cbT)" stroke="#C2C2C2" stroke-width="0.5"/>
<polygon points="459,111 494,84 494,530 459,558" fill="url(#cbS)" stroke="#C2C2C2" stroke-width="0.5"/>
