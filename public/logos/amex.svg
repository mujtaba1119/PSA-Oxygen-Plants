<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b5302a"/>
      <stop offset="50%" stop-color="#9b2224"/>
      <stop offset="100%" stop-color="#7e1c1e"/>
    </linearGradient>

    <filter id="glow3d" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#9b2224" flood-opacity="0.3"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 3D extrusion layers -->
  <text x="52" y="128" font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="120" letter-spacing="2" fill="#3a0a08" opacity="0.5">AMEX</text>
  <text x="51" y="127" font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="120" letter-spacing="2" fill="#4a0f0d" opacity="0.4">AMEX</text>

  <!-- Main AMEX -->
  <text x="50" y="125" font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="120" letter-spacing="2"
        fill="url(#redGrad)" filter="url(#glow3d)">AMEX</text>

  <!-- Top highlight -->
  <text x="50" y="125" font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="120" letter-spacing="2"
        fill="none" stroke="#c43a34" stroke-width="0.3" opacity="0.3">AMEX</text>

  <!-- WE CARE -->
  <text x="430" y="160" text-anchor="end"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-weight="500" font-size="26" letter-spacing="7"
        fill="#ffffff" filter="url(#subtleGlow)">WE CARE</text>
</svg>
