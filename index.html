<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSA Oxygen Plant — Complaint Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes headerReveal { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
      .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .fade-in { animation: fadeIn 0.35s ease-out both; }
      .slide-down { animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .scale-in { animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .header-reveal { animation: headerReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .stat-hover { transition: transform 0.2s ease; cursor: default; }
      .stat-hover:hover { transform: scale(1.1) translateY(-2px); }
      .tab-btn { transition: all 0.2s ease; }
      .tab-btn:hover { transform: translateY(-1px); }
      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

      /* ─── Mobile Responsive ─── */
      @media (max-width: 768px) {
        .top-bar-responsive { flex-direction: column !important; align-items: stretch !important; padding: 12px 16px !important; gap: 8px !important; min-height: auto !important; }
        .top-left-responsive { width: 100% !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; }
        .top-left-responsive img { height: 36px !important; }
        .top-center-responsive { width: 100% !important; gap: 14px !important; min-height: auto !important; justify-content: center !important; padding: 6px 0 !important; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; }
        .top-center-responsive img { height: 26px !important; }
        .top-center-responsive img:first-child { height: 32px !important; }
        .top-right-responsive { display: none !important; }
        .top-left-responsive .mobile-buttons { display: flex !important; gap: 6px; }
        .tab-bar-responsive { justify-content: center !important; padding: 8px 12px 16px !important; gap: 6px !important; }
        .tab-bar-responsive button { padding: 8px 14px !important; font-size: 10px !important; }
        .main-responsive { padding: 16px 12px !important; }
        .stats-responsive { gap: 8px !important; justify-content: space-between !important; }
        .stats-responsive > div { min-width: 0 !important; flex: 1 !important; }
        .stat-num-resp { font-size: 26px !important; }
        .stat-label-resp { font-size: 8px !important; letter-spacing: 1px !important; }
        .table-scroll-responsive { -webkit-overflow-scrolling: touch; overflow-x: auto; }
        .hospital-grid-responsive { grid-template-columns: 1fr 1fr !important; }
        .login-card-responsive { padding: 28px 20px !important; margin: 0 8px; }
        .group-header-responsive { flex-direction: column !important; align-items: flex-start !important; }
        .attention-wrap { flex-direction: column !important; }
      }
      @media (max-width: 480px) {
        .top-center-responsive img { height: 20px !important; }
        .top-center-responsive img:first-child { height: 26px !important; }
        .top-left-responsive img { height: 30px !important; }
        .top-title-responsive { font-size: 12px !important; }
        .hospital-grid-responsive { grid-template-columns: 1fr !important; }
        .stat-num-resp { font-size: 22px !important; }
      }
      .row-expand { overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
